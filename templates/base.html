<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Price Monitor{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/app.css">
  <script src="https://unpkg.com/htmx.org"></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/">Price Monitor</a>
      <nav class="nav">
        <a href="/" class="{% if active == 'prices' %}is-active{% endif %}">Prices</a>
        <a href="/tasks" class="{% if active == 'tasks' %}is-active{% endif %}">Tasks</a>
        <a href="/settings" class="{% if active == 'settings' %}is-active{% endif %}">Settings</a>
      </nav>
    </div>
  </header>
  <main class="page">
    {% block body %}{% endblock %}
  </main>
</body>
</html>
