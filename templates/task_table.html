{% extends "base.html" %}
{% block title %}Tasks · Price Monitor{% endblock %}
{% block body %}
  <div class="page-head">
    <div>
      <h1>Tasks</h1>
      <p class="lede">Latest collection jobs for Ozon companies and Wildberries cabinets.</p>
    </div>
  </div>
  <div class="table-wrap">
    <table class="data">
      <thead>
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Status</th>
          <th>Created</th>
          <th>Updated</th>
        </tr>
      </thead>
      <tbody hx-get="/tasks/list" hx-trigger="load">
      </tbody>
    </table>
  </div>
{% endblock %}
