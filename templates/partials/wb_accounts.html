{% for acc in wb_accounts %}
<tr>
  <td>{{ acc.name }}</td>
  <td class="muted">{{ acc.token_masked or "—" }}</td>
  <td class="actions">
    <div class="btn-row" style="justify-content: flex-end;">
      <button class="btn btn-danger"
              hx-delete="/wb_accounts/{{ acc.name }}"
              hx-target="#wb-account-list">
        Delete
      </button>
    </div>
  </td>
</tr>
{% else %}
<tr>
  <td colspan="3" class="empty">No cabinets yet. Add a name and an API token.</td>
</tr>
{% endfor %}
{% if wb_account_error %}
<tr>
  <td colspan="3" class="flash-err">{{ wb_account_error }}</td>
</tr>
{% endif %}
