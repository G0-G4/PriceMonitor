<section class="panel" id="wb-auth-block">
  <div class="panel-head">
    <div>
      <h2>Wildberries cabinets</h2>
      <p class="lede">Prices come from the official WB API (needs a personal or service token), SPP from the public storefront. No browser login is needed.</p>
    </div>
  </div>

  <form class="inline-add" hx-post="/wb_accounts" hx-target="#wb-account-list">
    <input type="text" name="account" placeholder="Account name" required>
    <input type="password" name="wb_api_token" placeholder="API token" autocomplete="off" required>
    <button type="submit" class="btn btn-primary">Add cabinet</button>
  </form>
  {% if wb_account_error %}
    <p class="flash-err">{{ wb_account_error }}</p>
  {% endif %}

  <div class="table-wrap" style="margin-top: 12px;">
    <table class="data">
      <thead>
        <tr>
          <th>Account</th>
          <th>Token</th>
          <th class="actions"></th>
        </tr>
      </thead>
      <tbody id="wb-account-list">
        {% include "partials/wb_accounts.html" %}
      </tbody>
    </table>
  </div>
</section>
