<tr>
  <td colspan="2">
    <form class="inline-add" hx-post="/company_ids" hx-target="#company-list">
      <input type="text" name="company_id" placeholder="Company ID" required>
      <button type="submit" class="btn btn-primary">Add</button>
    </form>
  </td>
</tr>
{% for company_id in company_ids %}
<tr>
  <td>{{ company_id }}</td>
  <td class="actions">
    <button class="btn btn-danger"
            hx-delete="/company_ids/{{ company_id }}"
            hx-target="#company-list">
      Delete
    </button>
  </td>
</tr>
{% else %}
<tr>
  <td colspan="2" class="empty">No company IDs yet.</td>
</tr>
{% endfor %}
{% if error %}
<tr>
  <td colspan="2" class="flash-err">{{ error }}</td>
</tr>
{% endif %}
