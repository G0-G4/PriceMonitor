<form class="inline-add" hx-post="/report_path" hx-target="#report-path-form">
  <input type="text" name="report_path" value="{{ report_path or '' }}" placeholder="Folder path">
  <button type="submit" class="btn btn-primary">Save folder</button>
  {% if saved %}
    <span class="flash-ok">Saved</span>
  {% endif %}
</form>
{% if error %}
  <p class="flash-err">{{ error }}</p>
{% endif %}
