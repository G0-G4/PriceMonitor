<tr>
  <td colspan="2">
    <form class="inline-add" hx-post="/scheduled_times" hx-target="#scheduled-times-list">
      <input type="time" name="scheduled_time" required>
      <button type="submit" class="btn btn-primary">Add</button>
    </form>
  </td>
</tr>
{% for scheduled_time in scheduled_times %}
<tr>
  <td>{{ scheduled_time }}</td>
  <td class="actions">
    <button class="btn btn-danger"
            hx-delete="/scheduled_times/{{ scheduled_time }}"
            hx-target="#scheduled-times-list">
      Delete
    </button>
  </td>
</tr>
{% else %}
<tr>
  <td colspan="2" class="empty">No scheduled times yet.</td>
</tr>
{% endfor %}
{% if error %}
<tr>
  <td colspan="2" class="flash-err">{{ error }}</td>
</tr>
{% endif %}
